---
name: Build and Release Docker Images

on:
  schedule:
    # 7am UTC, 12am PST
    - cron: '0 7 * * *'
  push:
    # For developer updates to trigger
    branches:
      - main
    paths-ignore:
      - 'README.md'
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'README.md'

jobs:
  # Defines shared release versions
  # Update release versions here when new Nav2 releases drop.
  config:
    name: Set Release Versions
    runs-on: ubuntu-latest
    outputs:
      release_versions: ${{ steps.vars.outputs.release_versions }}
    steps:
      - name: Define variables
        id: vars
        run: |
          echo "release_versions<<EOF" >> $GITHUB_OUTPUT
          echo '[
            {"ros_distro":"humble","main_version":"1","distro_version":"1"},
            {"ros_distro":"jazzy","main_version":"1","distro_version":"3"},
            {"ros_distro":"lyrical","main_version":"1","distro_version":"5"}
          ]' >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

  amd64:
    name: AMD64 Builds
    needs: config
    uses: ./.github/workflows/_reusable-docker-build.yml
    secrets: inherit
    with:
      runner: ubuntu-latest
      platform: linux/amd64
      dockerfile: docker/Dockerfile
      arch_suffix: ""
      # On PRs, only build standard+rolling to keep CI fast. Full matrix runs on merge.
      targets: ${{ github.event_name == 'pull_request' && '["standard"]' || '["devel","standard","production"]' }}
      nightly_distros: ${{ github.event_name == 'pull_request' && '["rolling"]' || '["humble","jazzy","lyrical","rolling"]' }}
      release_versions: ${{ needs.config.outputs.release_versions }}
      push: true

  arm64:
    name: ARM64 Builds
    needs: config
    # ARM64 builds are skipped on PRs
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/_reusable-docker-build.yml
    secrets: inherit
    with:
      runner: ubuntu-24.04-arm
      platform: linux/arm64
      dockerfile: docker/Dockerfile.arm64
      arch_suffix: "-arm64"
      targets: '["standard"]'
      nightly_distros: '["humble","jazzy","lyrical","rolling"]'
      release_versions: ${{ needs.config.outputs.release_versions }}
      push: true

  update_badge:
    name: Update README Build Status Badge
    runs-on: ubuntu-latest
    needs: [amd64, arm64]
    if: github.event_name != 'pull_request'

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update build date badge in README
        run: |
          # Get current date in YYYY-MM-DD format
          CURRENT_DATE=$(date -u +'%Y-%m-%d')
          # Update the badge in README.md
          sed -i "s/Last%20Build-[0-9]\{4\}--[0-9]\{2\}--[0-9]\{2\}/Last%20Build-${CURRENT_DATE//-/--}/g" README.md
          echo "Updated badge to: $CURRENT_DATE"

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add README.md
          # only commit if there are changes
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Badge: update build status badge [skip ci]"
            git push
          fi
